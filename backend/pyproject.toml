[project]
name = "flight-debrief"
version = "0.1.0"
description = "AI-powered flight debrief tool for paragliding pilots"
requires-python = ">=3.14"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.5.1",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
